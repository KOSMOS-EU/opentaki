# open_taki config
listen: ":9998"

# LLM Backend (microllm or direct vLLM) — for PDF OCR + image description
llm:
  api_base: "http://localhost:8012/v1"
  model: "local"
  max_tokens: 4096

# Whisper Backend — for audio/video transcription
# Leave api_base empty to disable audio support
whisper:
  api_base: "http://localhost:8019/v1"  # OpenAI-compatible Whisper API
  model: "whisper-large-v3"

# PDF to image conversion
pdf:
  dpi: 150
  max_pages: 20

# pdftotext fallback: if pdftotext extracts enough text, skip LLM
fallback:
  min_chars: 200          # minimum chars to consider pdftotext result valid
  min_chars_per_page: 50  # per page threshold
